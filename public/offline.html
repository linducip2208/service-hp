<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="theme-color" content="#14243b"/>
<title>Offline — ServiceHP</title>
<link rel="icon" href="/icons/icon-192.png">
<style>
  body{font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#14243b;color:#e6ecf5;display:flex;min-height:100dvh;margin:0;align-items:center;justify-content:center;padding:24px}
  .card{background:#16294a;border:1px solid rgba(255,255,255,.1);border-radius:16px;max-width:420px;width:100%;padding:36px 30px;text-align:center;box-shadow:0 24px 60px -20px rgba(0,0,0,.5)}
  .mark{display:inline-flex;align-items:center;justify-content:center;width:56px;height:56px;border-radius:16px;color:#fff;background:linear-gradient(135deg,#1769F5,#1a7ae0);font-weight:800;font-size:26px;box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
  h1{font-size:20px;margin:16px 0 8px;letter-spacing:-.01em}
  p{font-size:14px;color:#aebdd4;margin:0 0 22px;line-height:1.6}
  a.btn{display:inline-block;background:#1769F5;color:#fff;text-decoration:none;padding:11px 26px;border-radius:9px;font-size:15px;font-weight:600}
  a.btn:active{background:#0b4aa3}
  .hint{margin-top:18px;font-size:12px;color:#8ea1bd}
  .links{margin-top:10px;font-size:13px}
  .links a{color:#7fb3f5;margin:0 8px;text-decoration:none}
</style>
</head>
<body>
<main class="card">
  <span class="mark">S</span>
  <h1>Anda sedang offline</h1>
  <p>Koneksi internet terputus. Halaman yang sudah pernah dibuka (Login, Lacak Service, Booking) tetap bisa diakses dari cache. Transaksi baru membutuhkan koneksi.</p>
  <a class="btn" href="/">Coba lagi</a>
  <div class="links"><a href="/login">Login</a><a href="/track">Lacak Service</a><a href="/booking">Booking</a></div>
  <div class="hint">ServiceHP · mode offline (cache lokal)</div>
</main>
</body>
</html>
